<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Публикация материалов на сайт">
<title>Публикация материалов на сайт</title><desc>Исходный материал → скрипт публикации → REST API сайта на 1С-Битрикс → страница на сайте; статусы и SEO-поля возвращаются в скрипт.</desc>
<defs><marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#5e5a54"/></marker></defs>
<rect width="1600" height="900" fill="#f4f1eb"/>
<text x="80" y="130" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#1c1b18" text-anchor="start"><tspan x="80" dy="0">Публикация материалов на сайт</tspan></text>
<text x="80" y="184" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#5e5a54" text-anchor="start"><tspan x="80" dy="0">Выгрузка через REST API и синхронизация статусов</tspan></text>
<rect x="80" y="380" width="270" height="150" rx="22" fill="#fffcf7" stroke="#c9c3b8" stroke-width="2"/><text x="215.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1c1b18" text-anchor="middle"><tspan x="215.0" dy="0">Исходный материал</tspan></text><text x="215.0" y="477.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#5e5a54" text-anchor="middle"><tspan x="215.0" dy="0">статья, новость, страница</tspan></text><rect x="470" y="380" width="270" height="150" rx="22" fill="#1c1b18" stroke="#1c1b18" stroke-width="2"/><text x="605.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#f6f3ee" text-anchor="middle"><tspan x="605.0" dy="0">Скрипт публикации</tspan></text><text x="605.0" y="477.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#bdb7ac" text-anchor="middle"><tspan x="605.0" dy="0">собирает и отправляет</tspan></text><rect x="860" y="380" width="270" height="150" rx="22" fill="#fffcf7" stroke="#c9c3b8" stroke-width="2"/><text x="995.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1c1b18" text-anchor="middle"><tspan x="995.0" dy="0">REST API сайта</tspan></text><text x="995.0" y="477.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#5e5a54" text-anchor="middle"><tspan x="995.0" dy="0">1С-Битрикс</tspan></text><rect x="1250" y="380" width="270" height="150" rx="22" fill="#fffcf7" stroke="#c9c3b8" stroke-width="2"/><text x="1385.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1c1b18" text-anchor="middle"><tspan x="1385.0" dy="0">Страница на сайте</tspan></text><text x="1385.0" y="477.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#5e5a54" text-anchor="middle"><tspan x="1385.0" dy="0">опубликована</tspan></text><path d="M360 455.0 H456" fill="none" stroke="#5e5a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M750 455.0 H846" fill="none" stroke="#5e5a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1140 455.0 H1236" fill="none" stroke="#5e5a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M995.0 540 V640 H605.0 V544" fill="none" stroke="#5e5a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9" marker-end="url(#a)"/><rect x="654.0" y="620" width="292" height="40" rx="20" fill="#f4f1eb" stroke="#c9c3b8" stroke-width="2"/><text x="800.0" y="647" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#5e5a54" text-anchor="middle"><tspan x="800.0" dy="0">статусы и SEO-поля</tspan></text><text x="80" y="780" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#5e5a54" text-anchor="start"><tspan x="80" dy="0">Без ручного копирования в админку: материал попадает на сайт одним запуском.</tspan></text>
</svg>
