<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ежемесячная статистика соцсетей">
<title>Ежемесячная статистика соцсетей</title><desc>Сообщества в соцсетях → скрипт сбора, запускаемый раз в месяц → статистика за месяц в одном месте. Раньше сбор выполнялся вручную.</desc>
<defs><marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#5e5a54"/></marker></defs>
<rect width="1600" height="900" fill="#f4f1eb"/>
<text x="80" y="130" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#1c1b18" text-anchor="start"><tspan x="80" dy="0">Ежемесячная статистика соцсетей</tspan></text>
<text x="80" y="184" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#5e5a54" text-anchor="start"><tspan x="80" dy="0">Автоматический сбор вместо ручного</tspan></text>
<rect x="80" y="380" width="300" height="150" rx="22" fill="#fffcf7" stroke="#c9c3b8" stroke-width="2"/><text x="230.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1c1b18" text-anchor="middle"><tspan x="230.0" dy="0">Сообщества</tspan><tspan x="230.0" dy="32.5">в соцсетях</tspan></text><rect x="640" y="380" width="300" height="150" rx="22" fill="#1c1b18" stroke="#1c1b18" stroke-width="2"/><text x="790.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#f6f3ee" text-anchor="middle"><tspan x="790.0" dy="0">Скрипт сбора</tspan></text><text x="790.0" y="477.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#bdb7ac" text-anchor="middle"><tspan x="790.0" dy="0">запускается сам</tspan></text><rect x="1220" y="380" width="300" height="150" rx="22" fill="#fffcf7" stroke="#c9c3b8" stroke-width="2"/><text x="1370.0" y="447.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#1c1b18" text-anchor="middle"><tspan x="1370.0" dy="0">Статистика</tspan></text><text x="1370.0" y="477.0" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#5e5a54" text-anchor="middle"><tspan x="1370.0" dy="0">за месяц в одном месте</tspan></text><path d="M390 455 H626" fill="none" stroke="#5e5a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M950 455 H1206" fill="none" stroke="#5e5a54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="399.0" y="389" width="222" height="40" rx="20" fill="#f4f1eb" stroke="#c9c3b8" stroke-width="2"/><text x="510.0" y="416" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#5e5a54" text-anchor="middle"><tspan x="510.0" dy="0">1 раз в месяц</tspan></text><rect x="80" y="640" width="640" height="110" rx="22" fill="#f4f1eb" stroke="#c9c3b8" stroke-width="2" stroke-dasharray="9 9"/><text x="110" y="686" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#5e5a54" text-anchor="start"><tspan x="110" dy="0">Было</tspan></text><text x="110" y="724" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#5e5a54" text-anchor="start"><tspan x="110" dy="0">Ручной сбор по каждому сообществу</tspan></text><rect x="760" y="640" width="640" height="110" rx="22" fill="#fffcf7" stroke="#1c1b18" stroke-width="2"/><text x="790" y="686" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1b18" text-anchor="start"><tspan x="790" dy="0">Стало</tspan></text><text x="790" y="724" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1b18" text-anchor="start"><tspan x="790" dy="0">Статистика собирается автоматически</tspan></text>
</svg>
